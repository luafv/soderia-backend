spring.application.name=soderia-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 

# Zona horaria de Argentina
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
# Zona horaria para la serialización y deserialización de fechas JSON
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Swagger: ordena los endpoints por método (GET, POST...) y los grupos alfabéticamente
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
